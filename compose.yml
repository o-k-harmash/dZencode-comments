services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: postgres@postgres.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - app-network

  client:
    container_name: client
    image: me/hxh-react-client:runtime
    build:
      context: ./client
      dockerfile: ./Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - api
    networks:
      - app-network
  
  api:
    container_name: api
    build:
      context: ./api
      dockerfile: ./Dockerfile
    depends_on:
      - postgres
    ports:
      - "8001:8080"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge